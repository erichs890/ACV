<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ACV</title>
    <meta name="theme-color" content="#172554" />
    <!-- Ícones gerados por brand/gerar-logo.py a partir de brand/acv.jpg -->
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" type="image/png" href="/favicon-32.png" sizes="32x32" />
    <link rel="icon" type="image/png" href="/favicon-16.png" sizes="16x16" />
    <link rel="icon" type="image/png" href="/favicon-192.png" sizes="192x192" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=PT+Sans:wght@400;700&display=swap" rel="stylesheet" />
    <!--
      O tema tem de valer no PRIMEIRO QUADRO, senão a página pisca branca antes de ficar escura — e numa tela
      inteira isso incomoda os olhos de quem escolheu o escuro justamente por isso. Módulo não serve: ele
      carrega depois do CSS pintar. Daí este script embutido, que é a única duplicação da lógica de
      `src/tema.ts` (a chave e a leitura do sistema). Mexeu lá, mexa aqui.
    -->
    <script>
      (() => {
        const escolhido = localStorage.getItem('acv:tema') || 'sistema';
        const escuro = escolhido === 'escuro' || (escolhido === 'sistema' && matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.dataset.tema = escuro ? 'escuro' : 'claro';
        document.documentElement.style.colorScheme = escuro ? 'dark' : 'light';
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
