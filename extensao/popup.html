<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="ui/marca/icone-32.png" />
    <link rel="stylesheet" href="ui/fonte.css" />
    <link rel="stylesheet" href="ui/tokens.css" />
    <link rel="stylesheet" href="ui/marca.css" />
    <link rel="stylesheet" href="ui/base.css" />
    <link rel="stylesheet" href="ui/paginas.css" />
    <title>ACV</title>
  </head>
  <body class="popup">
    <!-- A marca substitui o <h1> visível: repetir logo e nome num popup de 360px desperdiça o espaço que é
         justamente o mais escasso. O nome continua lá para quem usa leitor de tela. -->
    <header class="cabecalho">
      <span class="marca" role="img" aria-label="ACV"></span>
      <h1 class="sr-only">ACV</h1>
      <span class="espaco"></span>
      <span id="conexao"></span>
    </header>

    <div class="pilha">
      <!-- "Esta aba" é novo e vem primeiro: é a pergunta que levou a pessoa a abrir o popup -->
      <section class="cartao">
        <header><h2>Esta aba</h2></header>
        <div class="corpo pilha">
          <p class="ajuda" id="abaSite">Lendo a página...</p>
          <button class="btn btn-sm btn-primary btn-largo" id="mostrarPainel" type="button">Mostrar o painel nesta página</button>
          <button class="btn btn-sm btn-secondary btn-largo" id="reavaliar" type="button">Reavaliar esta página</button>
          <p class="ajuda" id="diagnostico" role="status" aria-live="polite"></p>
        </div>
      </section>

      <section class="cartao cartao-verde">
        <header><h2>Hoje</h2></header>
        <div class="corpo">
          <div class="hoje" id="hoje"></div>
        </div>
      </section>

      <!-- Sincronizar é manutenção, não ação principal: era o segundo botão de largura total do popup -->
      <section class="cartao cartao-neutro">
        <header><h2>Ligação com o ACV</h2></header>
        <div class="corpo pilha">
          <p class="ajuda" id="ligacao" role="status" aria-live="polite"></p>
          <div class="linha">
            <button class="btn btn-sm btn-secondary" id="sincronizar" type="button">Sincronizar</button>
            <button class="btn btn-sm btn-secondary" id="config" type="button">Configurações</button>
          </div>
        </div>
      </section>
    </div>

    <script src="comum.js"></script>
    <script src="ui/orbe.js"></script>
    <script src="ui/plataformas.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
