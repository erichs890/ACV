<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <title>ACV</title>
    <style>
      body { font: 13px/1.45 system-ui, sans-serif; width: 300px; margin: 0; padding: 12px; color: #1b1b1f; }
      h1 { font-size: 14px; margin: 0 0 8px; }
      p { margin: 0 0 8px; color: #55555f; }
      button { font: inherit; width: 100%; box-sizing: border-box; padding: 7px 9px; border-radius: 7px; border: 1px solid #c9c9d1; background: #fff; cursor: pointer; margin-top: 6px; }
      button.principal { background: #1b3a8f; color: #fff; border-color: #1b3a8f; font-weight: 700; }
      .etiqueta { display: inline-block; border-radius: 9px; padding: 1px 7px; font-size: 11px; font-weight: 700; border: 1px solid #c9c9d1; }
      .ok { background: #e6f4ec; border-color: #17683a; color: #17683a; }
      .atencao { background: #fdf3e2; border-color: #a86a00; color: #a86a00; }
      table { width: 100%; border-collapse: collapse; font-size: 12px; margin-top: 6px; }
      td { padding: 2px 0; } td.n { text-align: right; font-variant-numeric: tabular-nums; }
      #saida { margin-top: 8px; white-space: pre-wrap; font-size: 11px; }
      .erro { color: #a03000; font-weight: 700; }
    </style>
  </head>
  <body>
    <h1>ACV</h1>
    <p id="conexao"><span class="etiqueta">verificando...</span></p>
    <table id="hoje"></table>
    <button class="principal" id="config" type="button">Configurações</button>
    <button id="sincronizar" type="button">Sincronizar com o ACV</button>
    <button id="reavaliar" type="button">Reavaliar esta página</button>
    <div id="saida" role="status"></div>
    <script src="comum.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
